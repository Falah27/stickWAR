<style>

</style></head><body><div id="game"><canvas id="c" width="960" height="540"></canvas><button id="modeBtn" class="topBtn" type="button">Kontrol: Keyboard</button><button id="fullBtn" class="topBtn" type="button">Layar penuh</button><div id="touchControls"><div class="pad"><button class="ctrl left" data-code="ArrowLeft">◀</button><button class="ctrl right" data-code="ArrowRight">▶</button><button class="ctrl jump" data-code="Space">▲</button><button class="ctrl down" data-code="ArrowDown">▼</button></div><div class="actions"><button class="ctrl attack" data-action="attack">SERANG</button><button class="ctrl skill" data-action="skill">SKILL</button><button class="ctrl ult" data-action="ult">ULT</button></div><button class="ctrl pause" data-code="Escape">Ⅱ</button></div></div><div id="controllerSelect"><div class="controllerCard"><h1>Pilih Kontrol</h1><p>Pilih cara bermain sebelum memilih karakter.</p><div class="controllerOptions"><button id="chooseTouch" class="controllerChoice touchChoice">📱 Tombol HP<small>Kontrol sentuh untuk Android dan iPhone</small></button><button id="chooseKeyboard" class="controllerChoice">⌨️ Keyboard<small>A/D, Space, J, K, dan L</small></button></div></div></div><div id="rotateNotice"><div><span class="phone">📱</span>Putar HP ke posisi landscape<small>Game dirancang untuk dimainkan secara horizontal.</small></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540,G=440,WORLD=1800;
const K={},PR={};
addEventListener('keydown',e=>{if(/Space|Arrow/.test(e.code))e.preventDefault();if(!K[e.code])PR[e.code]=1;K[e.code]=1});
addEventListener('keyup',e=>K[e.code]=0);
addEventListener('blur',()=>{for(const k in K)K[k]=0;for(const k in PR)delete PR[k]});
const GAME=document.getElementById('game'),MODE=document.getElementById('modeBtn'),FULL=document.getElementById('fullBtn'),CONTROLLER_SELECT=document.getElementById('controllerSelect');
let controlMode='keyboard',controlsChosen=false;
function setControlMode(mode){controlMode=mode;controlsChosen=true;GAME.classList.toggle('touch',mode=='touch');MODE.textContent='Kontrol: '+(mode=='touch'?'Tombol':'Keyboard');CONTROLLER_SELECT.classList.add('hidden');for(const k in K)K[k]=0;for(const k in PR)delete PR[k]}
async function landscapeFullscreen(){try{if(!document.fullscreenElement)await GAME.requestFullscreen();if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){} }
document.getElementById('chooseTouch').addEventListener('click',async()=>{setControlMode('touch');await landscapeFullscreen()});
document.getElementById('chooseKeyboard').addEventListener('click',()=>setControlMode('keyboard'));
MODE.addEventListener('click',()=>{CONTROLLER_SELECT.classList.remove('hidden');controlsChosen=false});
FULL.addEventListener('click',landscapeFullscreen);
function virtualCode(btn){const a=btn.dataset.action;if(!a)return btn.dataset.code;if(S=='upgrade')return a=='attack'?'Digit1':a=='skill'?'Digit2':'Digit3';if(S=='menu')return a=='attack'?'Enter':a=='skill'?'Digit2':a=='ult'?'Digit3':btn.dataset.code;return a=='attack'?'KeyJ':a=='skill'?'KeyK':'KeyL'}
for(const b of document.querySelectorAll('.ctrl')){const start=e=>{e.preventDefault();if(controlMode!='touch')return;const code=virtualCode(b);b._code=code;if(!K[code])PR[code]=1;K[code]=1;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch{}};const end=e=>{e.preventDefault();if(b._code)K[b._code]=0;b.classList.remove('active')};b.addEventListener('pointerdown',start);b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('lostpointercapture',end)}
const down=(...c)=>c.some(k=>K[k]),pressed=(...c)=>c.some(k=>PR[k]),R=Math.random;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CH=[
{n:'Swordsman',col:'#4df',hp:120,ac:.32,cd:3,wp:'sword',d:'Melee seimbang',sk:'K: Dash Slash',ul:'L: Shockwave'},
{n:'Archer',col:'#6f8',hp:90,ac:.28,cd:5,wp:'bow',d:'Jarak jauh',sk:'K: Hujan Panah',ul:'L: Laser Panah'},
{n:'Mage',col:'#c6f',hp:80,ac:.5,cd:4.5,wp:'staff',d:'AoE elemen',sk:'K: Petir Berantai',ul:'L: Meteor Storm'}];
const UP=[{n:'Damage +20%',f:p=>p.dm*=1.2},{n:'Kecepatan +15%',f:p=>p.sp*=1.15},{n:'Max HP +25 dan pulih penuh',f:p=>{p.mhp+=25;p.hp=p.mhp}},{n:'Cooldown skill -20%',f:p=>p.cdm*=.8},{n:'Isi ultimate +40%',f:p=>p.em*=1.4},{n:'Crit chance +10%',f:p=>p.cr+=.1}];
let S='menu',sel=0,wave=1,score=0,combo=0,comboT=0,p,E=[],P=[],F=[],T=[],FX=[],D=[],shake=0,hit=0,slowT=0,slow=1,queue=[],spT=0,bn=0,opts=[],cam=0,tm=0,PL=[],SP=[],SW=[],JP=[],flash=0,zoom=1,LV=[],RK=[],LS=[],BR=[],PD=[],rkT=3;
function newGame(){const c=CH[sel];p={x:900,y:G,vx:0,vy:0,f:1,hp:c.hp,mhp:c.hp,ult:0,atkT:0,acd:0,cd:0,inv:0,dash:0,met:0,mt:0,dm:1,sp:1,cdm:1,em:1,cr:.1,run:0,t:0,on:1,drop:0,pl:0};E=[];P=[];F=[];T=[];FX=[];D=[];PL=[];SP=[];SW=[];JP=[];LV=[];RK=[];LS=[];BR=[];PD=[];queue=[];wave=1;score=0;combo=0;comboT=0;spT=0;bn=0;cam=0;shake=0;hit=0;slowT=0;slow=1;flash=0;zoom=1;rkT=3;S='play';startWave()}
function inPit(x){return LV.some(l=>x>l.x+4&&x<l.x+l.w-4)}
function lsPh(l){const m=l.t%4;return m<2.2?0:m<2.9?1:2}
function knock(e,vx,vy){const m=e.boss?8:e.k=='shield'?1.8:1;e.kv+=vx/m/8;if(!e.boss){e.vy+=vy/m;e.on=0}}
function rag(e,vx,vy){const x=e.x,y=e.y,s=e.s;const pts=[[0,-52],[0,-42],[0,-22],[-10,-30],[10,-30],[-6,0],[6,0]].map(([a,b])=>({x:x+a*s,y:y+b*s,px:x+a*s-vx*.016,py:y+b*s-vy*.016}));
const cs=[[0,1],[1,2],[1,3],[1,4],[2,5],[2,6]].map(([a,b])=>[a,b,Math.hypot(pts[a].x-pts[b].x,pts[a].y-pts[b].y)]);D.push({pts,cs,col:e.col,s,life:3})}
function explode(b){if(b.dead)return;b.dead=1;boom({x:b.x,y:G,aoe:140,dmg:55,col:'#fa3'});FX.push({t:'ring',x:b.x,y:G,r:0,max:200,life:.5,ml:.5,col:'#fff'});burst(b.x,G-20,45,'#fb4',650);shake=Math.max(shake,14);flash=Math.max(flash,.3);hit=Math.max(hit,.06);
if(Math.abs(p.x-b.x)<140&&p.y>G-90)hurt(20,Math.sign(p.x-b.x)||1);for(const o of BR)if(!o.dead&&Math.abs(o.x-b.x)<170)o.fuse=o.fuse||.12}
function BRU(dt){for(const b of BR){if(b.dead)continue;if(Math.abs(p.x-b.x)<26&&p.y>G-34&&Math.abs(p.vx)>20)b.vx+=(p.vx-b.vx)*.35;
b.x+=b.vx*dt;b.vx*=Math.pow(.02,dt);if(b.x<20||b.x>WORLD-20){b.x=Math.max(20,Math.min(WORLD-20,b.x));b.vx*=-.5}
if(inPit(b.x)){b.dead=1;burst(b.x,G,20,'#f80',400);continue}
for(const s of SW)if(Math.abs(s.x-b.x)<s.r+14)b.fuse=b.fuse||.05;
for(const l of LS)if(lsPh(l)==2&&b.x>l.x1&&b.x<l.x2&&l.y>b.y-38&&l.y<b.y)b.fuse=b.fuse||.05;
if(b.fuse>0){b.fuse-=dt;if(b.fuse<=0)explode(b)}}BR=BR.filter(b=>!b.dead)}
function PDU(dt){for(const d of PD){d.w+=-(1800/d.L)*Math.sin(d.a)*dt;d.a+=d.w*dt;d.bx=d.x+Math.sin(d.a)*d.L;d.by=d.y+Math.cos(d.a)*d.L;d.cd-=dt;
if(Math.hypot(p.x-d.bx,p.y-30-d.by)<d.r+14&&p.inv<=0){hurt(18,Math.sign(p.x-d.bx)||1);p.vy=-400}
if(d.cd<=0){let h=0;for(const e of E)if(!e.dead&&Math.hypot(e.x-d.bx,e.y-30*e.s-d.by)<d.r+e.w){h=1;knock(e,Math.sign(e.x-d.bx)*600,-450);dmgE(e,16,0,1)}if(h)d.cd=.35}
for(const b of BR)if(Math.hypot(b.x-d.bx,b.y-18-d.by)<d.r+16)b.fuse=b.fuse||.05}}
function HZ(dt){for(const pl of PL)if(pl.m){const nx=pl.bx+Math.sin(tm*pl.sp+pl.ph)*pl.ax,ny=pl.by+Math.sin(tm*pl.sp*.9+pl.ph)*pl.ay;pl.dx=nx-pl.x;pl.dy=ny-pl.y;pl.x=nx;pl.y=ny}
if(p.on&&p.pl&&p.pl.m){p.x+=p.pl.dx;p.y=p.pl.y}BRU(dt);PDU(dt);
if(p.y>G+45){const l=LV.find(l=>p.x>l.x-10&&p.x<l.x+l.w+10);if(l){p.x=Math.max(30,Math.min(WORLD-30,p.x<l.x+l.w/2?l.x-35:l.x+l.w+35));p.y=G;p.vy=-650;p.vx=0;p.inv=0;burst(p.x,G,30,'#f80',500);flash=.25;hurt(22,0);p.inv=Math.max(p.inv,1.2)}else{p.y=G;p.vy=0}}
rkT-=dt;if(wave>=2&&rkT<=0){rkT=Math.max(1.6,4.5-wave*.35)*(.7+R()*.6);RK.push({x:Math.max(40,Math.min(WORLD-40,p.x+(R()-.5)*600)),warn:1,y:-40,vy:0})}
for(const r of RK){if(r.warn>0){r.warn-=dt;continue}r.vy+=1800*dt;r.y+=r.vy*dt;F.push({x:r.x,y:r.y-10,vx:R()*40-20,vy:-30,life:.3,ml:.3,col:'#fa6',sz:4,g:0});
let brk=0;if(Math.abs(p.x-r.x)<24&&r.y>p.y-70&&r.y<p.y+10&&p.inv<=0){hurt(18,Math.sign(p.x-r.x)||1);brk=1}
for(const e of E)if(!e.dead&&Math.abs(e.x-r.x)<e.w+16&&r.y>e.y-65*e.s&&r.y<e.y+5){dmgE(e,30,0,1);brk=1}
if(r.y>=G-14)brk=1;
if(brk){r.dead=1;burst(r.x,Math.min(r.y,G-10),20,'#a98',350);shake=Math.max(shake,8);FX.push({t:'ring',x:r.x,y:G,r:0,max:70,life:.3,ml:.3,col:'#fa6'})}}
RK=RK.filter(r=>!r.dead);
for(const l of LS){l.t+=dt;l.cd-=dt;if(lsPh(l)==2){if(p.x>l.x1&&p.x<l.x2&&l.y>p.y-62&&l.y<p.y+2)hurt(14,-p.f);if(l.cd<=0){l.cd=.4;for(const e of E)if(!e.dead&&e.x>l.x1&&e.x<l.x2&&l.y>e.y-65*e.s&&l.y<e.y+2)dmgE(e,12,0,1)}}}
for(const l of LV)if(R()<dt*10)F.push({x:l.x+R()*l.w,y:G+8,vx:0,vy:-120-R()*160,life:.8,ml:.8,col:'#fa3',sz:3,g:400})}
function gen(){PL=[];SP=[];SW=[];JP=[];LV=[];RK=[];LS=[];BR=[];PD=[];p.pl=0;rkT=3;for(let i=0,n=Math.min(wave>>1,3);i<n;i++){const x=300+R()*(WORLD-700),w=110+R()*60;if(Math.abs(x+w/2-p.x)>220&&!LV.some(l=>Math.abs(l.x-x)<400))LV.push({x,w})}for(let i=0;i<7;i++)PL.push({x:120+i*250+R()*70,w:110+R()*90,y:G-(i%2?185:100)});
const n=Math.min(2+wave,6);for(let i=0;i<n;i++){const x=150+R()*(WORLD-300);if(Math.abs(x-p.x)>140&&!inPit(x)&&!inPit(x+80))SP.push({x,w:50+R()*30})}
for(let i=0;i<Math.min(wave-1,3);i++){const a=200+R()*600;SW.push({x:a,a,b:a+300+R()*400,v:(90+R()*60)*(R()<.5?1:-1),r:20,rot:0,cd:0})}
for(let i=0;i<2;i++){const x=300+i*900+R()*200;if(!inPit(x-30)&&!inPit(x+30))JP.push({x})}
for(let i=0,n=wave<3?0:Math.min(wave-1>>1,3);i<n;i++){const x1=100+R()*(WORLD-500);LS.push({x1,x2:x1+250+R()*250,y:G-(R()<.5?35:130),t:R()*4,cd:0})}
for(let i=0;i<3;i++){const l=LV[i],bx=l?l.x+l.w/2-50:250+i*550+R()*150,by=G-(120+R()*60);PL.push({x:bx,y:by,w:100,m:1,bx,by,ax:l?50:90+R()*60,ay:R()<.5?0:45,sp:1+R()*.8,ph:R()*6,dx:0,dy:0})}
for(let i=0,n=2+Math.min(wave,3);i<n;i++){const x=150+R()*(WORLD-300);if(Math.abs(x-p.x)>120&&!inPit(x-20)&&!inPit(x+20))BR.push({x,y:G,vx:0})}
for(let i=0,n=wave<2?0:Math.min(wave-1,2);i<n;i++){const L=180+R()*80,x=300+R()*(WORLD-600),a=1+R()*.3,bot=R()<.5?G-22:G-100;PD.push({x,y:bot-L,L,a,w:0,r:22,cd:0,bx:x+Math.sin(a)*L,by:bot-L+Math.cos(a)*L})}}
function startWave(){gen();P=[];RK=[];p.inv=Math.max(p.inv,2.2);p.drop=0;p.pl=0;queue=[];const n=Math.min(14,4+Math.floor(wave*1.5));for(let i=0;i<n;i++){const r=R(),shieldChance=wave>=4?Math.min(.18,.06+wave*.008):0,archerChance=wave>=2?Math.min(.22,.10+wave*.008):0;queue.push(r<shieldChance?'shield':r<shieldChance+archerChance?'archer':'soldier')}
if(wave%5==0){queue.unshift('boss');for(let i=0;i<3;i++)queue.push('soldier')}bn=2.2;spT=1.25}
const BASE={soldier:{hp:32,sp:118,dmg:7,s:1,col:'#f66'},archer:{hp:24,sp:82,dmg:6,s:1,col:'#fb4'},shield:{hp:58,sp:68,dmg:9,s:1.1,col:'#a6f',arm:.72},boss:{hp:720,sp:62,dmg:18,s:2.4,col:'#f94',boss:1}};
function spawn(k){const b=BASE[k],isBoss=k=='boss',hpScale=1+(wave-1)*(isBoss?.045:.075),bossTier=isBoss?1+.18*Math.max(0,wave/5-1):1,hp=b.hp*hpScale*bossTier,dmgScale=1+Math.min(.65,(wave-1)*.028),speedScale=1+Math.min(isBoss?.16:.24,(wave-1)*.009);
E.push({k,x:R()<.5?-30:WORLD+30,y:G,hp,mhp:hp,sp:b.sp*speedScale,dmg:b.dmg*dmgScale,s:b.s,w:14*b.s,col:b.col,boss:b.boss,arm:b.arm,t:R()*5,cd:1,kv:0,fl:0,run:0,f:1,atk:0,wind:0,sc:3,vy:0,on:1,jc:0,cc:0})}
function burst(x,y,n,col,sp=300){for(let i=0;i<n;i++){const a=R()*6.28,v=R()*sp;F.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.4+R()*.5,ml:.9,col,sz:2+R()*3,g:700,st:R()<.4})}}
const txt=(x,y,s,col,sz)=>T.push({x,y,s,col,sz,life:.8});
function dmgE(e,d,kx=0,big){if(e.dead)return;d*=p.dm;const cr=R()<p.cr;if(cr)d*=2;if(e.arm)d*=e.arm;d=Math.round(d);e.hp-=d;e.fl=.1;e.kv+=kx*(e.boss?.2:6)/(e.k=='shield'?1.8:1);e.kv=Math.max(-220,Math.min(220,e.kv));
p.ult=Math.min(100,p.ult+d*.15*p.em);combo++;comboT=2.5;score+=d;txt(e.x,e.y-70*e.s,d,cr?'#fd3':'#fff',cr?28:18);FX.push({t:'flash',x:e.x,y:e.y-30*e.s,life:.14,ml:.14,col:cr?'#fd3':'#fff'});burst(e.x,e.y-30*e.s,6,e.col);
hit=Math.max(hit,big?.07:.03);shake=Math.max(shake,big?9:3);if(e.hp<=0)kill(e)}
function kill(e){e.dead=1;rag(e,e.kv*8+(e.x>p.x?1:-1)*(100+R()*200),(e.vy||0)-350-R()*300);
